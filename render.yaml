services:
  - type: web
    name: ingles-do-zero
    runtime: python
    plan: 0.5c-512mb
    region: virginia
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/ingles.sqlite3
    disk:
      name: student-progress
      mountPath: /var/data
      sizeGB: 1
